<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>픽셀 행동 검수</title>
<style>body{margin:24px;background:#eee8dc;color:#293c42;font:15px system-ui}h1{font-size:22px}button{min-height:44px;padding:0 18px;background:#477a6d;color:white;border:0;border-radius:10px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:20px}article{background:#fbf6e9;border:1px solid #c9c6b3;border-radius:12px;padding:12px}canvas{width:100%;image-rendering:pixelated}p{line-height:1.6}</style>
<h1>픽셀 행동 검수</h1><p>정면 · 측면 · 후면 순서. 걷기 사이에도 머리와 발 기준선이 유지되는지 확인합니다.</p><button id="toggle">일시 정지</button><main></main>
<script src="../web/pixel/v3/assets.js"></script><script>
const labels={claude:'Claude',gpt:'GPT',gemini:'Gemini',design:'디자인팀장',head:'본부장',finance:'경리팀장',intern:'인턴',courier:'택배 기사',visitor:'방문객',eden:'이든'},items=[];let playing=true,elapsed=0,last=performance.now();
for(const[id,a]of Object.entries(PIXEL_ASSETS_V3.characters)){const card=document.createElement('article'),title=document.createElement('strong'),cv=document.createElement('canvas'),im=new Image();title.textContent=labels[id];cv.width=240;cv.height=96;im.src='../web/'+a.src;card.append(title,cv);document.querySelector('main').append(card);items.push({a,im,cv});}
document.querySelector('#toggle').onclick=e=>{playing=!playing;e.target.textContent=playing?'일시 정지':'재생';};
function render(t){if(playing)elapsed+=Math.min(100,t-last);last=t;const phase=[0,2,1,2][Math.floor(elapsed/180)%4];for(const{a,im,cv}of items){const c=cv.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,240,96);for(const[slot,dir]of ['front','side','back'].entries()){const f=a.frames[phase===2?'stand.'+dir:'walk.'+dir+'.'+phase];if(im.complete&&im.naturalWidth)c.drawImage(im,f.x,f.y,f.w,f.h,slot*80+40-f.w/2,70-f.h,f.w,f.h);c.fillStyle='#c9c6b3';c.fillRect(slot*80+12,71,56,1);}}requestAnimationFrame(render);}requestAnimationFrame(render);
</script></html>
