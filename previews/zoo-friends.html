<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동물원 친구들 · 3D 에셋</title><style>body{margin:0;background:#f9ecec;font:15px system-ui;color:#473f42}canvas{display:block}header{position:absolute;top:24px;left:30px}h1{font-size:24px;margin:0 0 8px}p{margin:0;color:#78656a}footer{position:absolute;bottom:25px;left:0;right:0;text-align:center}button{border:0;border-radius:20px;background:#fff;padding:12px 22px;margin:4px;color:#51444a;cursor:pointer}.names{margin:12px}</style><header><h1>동물원에 놀러 온 세 친구</h1><p>실제 3D 모델 · 드래그로 회전 · 휠로 확대</p></header><footer><div class="names">우사기 · 치이카와 · 하치와레</div><button id="walk">걷기 / 쉬기</button><button id="roam">산책 / 나란히 보기</button></footer><script src="../web/vendor/three.min.js"></script><script src="../web/vendor/OrbitControls.js"></script><script src="../web/zoo-friends.js"></script><script>
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf9ecec);const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,100);camera.position.set(0,2.8,9.5);const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.target.set(0,1.1,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=4;controls.maxDistance=20;
scene.add(new THREE.HemisphereLight(0xffffff,0xb6a3a3,.65));const sun=new THREE.DirectionalLight(0xfff4e4,2.1);sun.position.set(-3,7,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8});scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(20,64),new THREE.MeshStandardMaterial({color:0xf3dfe1,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;ground.position.y=-.015;scene.add(ground);
const friends=ZooFriends.kinds.map((k,i)=>{const r=ZooFriends.build(k);r.group.position.x=(i-1)*2.2;scene.add(r.group);return r;});let walking=true,roam=false,time=0,last=performance.now();const reduced=matchMedia('(prefers-reduced-motion: reduce)');walking=!reduced.matches;document.getElementById('walk').onclick=()=>walking=!walking;document.getElementById('roam').onclick=()=>{roam=!roam;if(!roam)friends.forEach((r,i)=>{r.group.position.set((i-1)*2.2,0,0);r.group.rotation.y=0;});};
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.hidden)time+=dt;friends.forEach((r,i)=>{r.animate(time+i*.6,walking);if(roam&&walking){const a=time*.3+i*2.094;r.group.position.set(Math.cos(a)*2.5,0,Math.sin(a)*1.5);r.group.rotation.y=Math.atan2(-2.5*Math.sin(a),1.5*Math.cos(a));}});controls.update();renderer.render(scene,camera);}requestAnimationFrame(frame);onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};
</script></html>
