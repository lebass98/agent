# 팀 구성 설정 — 팀원 추가/역할 변경은 이 파일만 수정하면 됩니다.
#
# provider 종류
#   CLI (구독 로그인, API 키·크레딧 불필요):
#     claude-cli  → `claude -p`   Claude Code 의 claude.ai 로그인(Max/Pro). model: opus | sonnet | haiku
#     codex-cli   → `codex exec`  Codex CLI 의 ChatGPT 로그인.            model: default (CLI 기본) 또는 codex 가 허용하는 이름
#     antigravity-cli → `agy -p` Antigravity CLI 의 Google 로그인(AI Pro/Ultra 구독). model: gemini-3.8-flash-medium 등 (`agy models`)
#     gemini-cli  → `gemini -p`   Gemini CLI (Google 개인 로그인은 2026-06 지원 종료 → antigravity-cli. API 키 로그인은 가능)
#   API (키 필요, .env):  anthropic | openai | google
#   mock: 테스트용 (--mock 으로 전체 전환)
#
# 처음 한 번은 각 CLI 로 로그인: `claude` / `codex login` / `gemini`
# API 로 돌리려면 provider 를 바꾸고 model 을 실제 API 모델명으로 적는다 (예: anthropic + claude-opus-5-5)

[leader]
member = "claude"   # 업무 분배·검수·최종 보고 담당
# 업무 배정 원칙 — 팀장이 계획을 세울 때 가장 먼저 따른다(구독 사용량에 맞춘 분담)
guide = """
- Claude(팀장, Max 20 요금제로 사용량이 넉넉함)가 주된 업무를 맡는다: 기획, 설계, 개발·코드, 문서·원고, 분석, 검수 등 핵심 결과물은 기본적으로 claude 에게 배정한다.
- GPT 에게는 이미지·그림 제작(SVG 등), UI/UX 탐색·시안·화면 개선 제안처럼 시각·디자인 성격의 업무만 배정한다.
- Gemini 에게는 자료 정리, 요약, 번역, 목록·표 만들기, 맞춤법·사실 확인 같은 가벼운 잡무만 배정한다.
- 애매하면 claude 에게 배정한다.
"""

[members.claude]
provider = "claude-cli"
model = "opus"
role = "팀장 겸 메인 담당. 기획·설계·개발·문서 등 핵심 업무 대부분, 업무 분해·배정, 결과 검수"

[members.gpt]
provider = "codex-cli"
model = "default"
role = "디자이너. 이미지·그림 제작, UI/UX 탐색과 시안, 화면 개선 제안"

[members.gemini]
provider = "antigravity-cli"     # `agy -p` — Google AI Pro/Ultra 구독 로그인 (Gemini CLI 개인 로그인은 2026-06 종료)
model = "gemini-3.8-flash-medium"  # `agy models` 로 확인: gemini-3.8-flash-high|medium|low 등. 무료 API 로 돌리려면 provider="google", model="gemini-3.6-flash"
role = "지원 담당. 자료 정리·요약·번역·확인 등 잡무"
