<div id="stage"></div>
<div id="labels" aria-hidden="true"></div><!-- 3D 위 HTML 라벨 컨테이너(이름표·말풍선·방 이름 모두 여기에) -->

<!-- ── 상단 바 ── -->
<header class="topbar" id="topbar">
  <div class="tb-left">
    <button class="icon-btn round menu-btn" id="menuBtn" type="button" aria-label="메뉴 열기" aria-controls="sidebar" aria-expanded="false">
      <svg class="ic"><use href="#i-menu"/></svg>
    </button>
    <div class="workspace-brand"><small class="breadcrumb">워크스페이스 <span>/</span> <button type="button" class="space-crumb" id="spaceBtn" aria-haspopup="dialog">내 팀</button></small><div class="brand">WordNCode Agent Office<small id="brandSub">멀티 에이전트 워크스페이스</small></div></div>
    <button class="icon-btn round" id="searchBtn" type="button" aria-label="검색 (⌘K)" title="검색">
      <svg class="ic"><use href="#i-search"/></svg><span class="search-hint">업무, 기록 검색하기</span><kbd>⌘ K</kbd>
    </button>
    <button class="primary" id="newAgentBtn" type="button" aria-label="새 에이전트 추가" title="새 에이전트 추가">
      <svg class="ic"><use href="#i-plus"/></svg><span>에이전트 추가</span>
    </button>
  </div>
  <div class="tb-right">
    <button class="chip conn" id="conn" type="button" role="status" aria-live="polite"><i></i><span id="connText">연결 중…</span></button>
    <span class="chip" id="dateChip"><svg class="ic"><use href="#i-calendar"/></svg><span id="dateText">—</span></span>
    <div class="speed" id="speed" role="group" aria-label="연출 속도">
      <button type="button" data-s="1">1x</button><button type="button" data-s="2">2x</button><button type="button" data-s="4">4x</button>
    </div>
    <button class="speed-cycle" id="speedCycle" type="button">1×</button>
    <span class="chip" id="clock" title="현재 업무 경과 시간"><svg class="ic"><use href="#i-clock"/></svg><span id="clockText">00:00</span></span>
    <span class="avatar-btn" id="avatar" aria-hidden="true"><svg class="ic"><use href="#i-user"/></svg></span>
  </div>
</header>

<!-- ── 왼쪽 사이드바 (휴대폰: 서랍) ── -->
<div class="scrim" id="scrim" hidden></div>
<aside class="panel left" id="sidebar" aria-label="사이드바">
  <div class="drawer-head">
    <div class="brand">WordNCode Agent Office<small>멀티 에이전트 팀</small></div>
    <button class="icon-btn" id="drawerClose" type="button" aria-label="메뉴 닫기"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <a class="rail-logo" href="./" aria-label="WordNCode Agent Office 홈"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 27 16 4l13 23H20l-4-8-4 8Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg></a>
  <nav class="sidenav" id="sidenav" aria-label="메뉴">
    <button type="button" data-view="office" aria-current="page" title="사무실"><svg class="ic"><use href="#i-dash"/></svg><span>사무실</span></button>
    <button type="button" data-view="board" title="업무"><svg class="ic"><use href="#i-kanban"/></svg><span>업무</span></button>
    <button type="button" data-view="timeline" title="타임라인"><svg class="ic"><use href="#i-timeline"/></svg><span>타임라인</span></button>
    <button type="button" data-view="stats" title="분석(사용량·비용)"><svg class="ic"><use href="#i-chart"/></svg><span>분석</span></button>
    <button type="button" data-view="members" title="에이전트"><svg class="ic"><use href="#i-users"/></svg><span>에이전트</span></button>
    <button type="button" data-view="projects" title="프로젝트(폴더 접근)"><svg class="ic"><use href="#i-folder-open"/></svg><span>프로젝트</span></button>
    <button type="button" data-view="library" title="자료실"><svg class="ic"><use href="#i-folder"/></svg><span>자료실</span></button>
    <button type="button" data-view="settings" title="설정"><svg class="ic"><use href="#i-gear"/></svg><span>설정</span></button>
  </nav>
  <div class="drawer-only drawer-tools">
    <button class="tbtn" id="drawerSearch" type="button"><svg class="ic"><use href="#i-search"/></svg><span>검색</span></button>
    <button class="tbtn" id="drawerNewAgent" type="button"><svg class="ic"><use href="#i-plus"/></svg><span>새 에이전트</span></button>
  </div>
  <button class="rail-profile" id="railProfile" type="button" aria-label="설정 열기"><svg class="ic"><use href="#i-user"/></svg><span>내 설정</span></button>
  <div class="progress-slot" id="progressSide"></div>
  <div class="drawer-only" id="drawerTheme"></div>
</aside>

<section class="run-strip" aria-label="현재 업무 진행">
  <span class="run-symbol"><svg class="ic"><use href="#i-clipboard"/></svg></span>
  <div class="run-info"><strong id="activeGoal">팀과 함께, 다음 아이디어를 현실로</strong><small id="activePhase">업무를 입력하면 팀장이 계획하고 배정합니다</small></div>
  <span class="run-project" id="runProject" role="note" hidden><svg class="ic"><use href="#i-folder-open"/></svg><span id="runProjectName"></span></span>
  <ol class="run-steps" id="runSteps" aria-label="진행 단계"><li>계획</li><li>실행</li><li>검수</li></ol>
  <div class="run-completion"><strong id="completionValue">대기</strong><progress id="completionBar" max="100" value="0" aria-label="업무 완료 비율"></progress></div>

    <button class="send" id="runBtn" type="submit" aria-label="업무 지시"><svg class="ic"><use href="#i-send"/></svg></button>
  </form>
  <div class="dock-card">
    <button class="dock-handle" id="dockHandle" type="button" aria-expanded="false" aria-controls="panes">

        </section>
      </aside>
      <section class="pane progress-slot" data-pane="progress" id="progressDock" aria-label="오늘의 진행률"></section>
    </div>
  </div>
</section>
