<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D 에셋 검수</title>
<style>body{margin:0;background:#171c27;color:#fff;font:15px system-ui}header{padding:16px}a{color:#9dc9ff;margin-right:12px}button{padding:8px;margin:4px}canvas{display:block}p{margin:8px 0}</style>
<header><b>Agent Office · 실제 입체 에셋</b><p>1 단위 = 1m · 회전: 드래그 · 확대: 휠 · OBJ는 정적 모델, 런타임 캐릭터는 관절 애니메이션 사용</p>
<button data-mode="characters">캐릭터 크기 비교</button><button data-mode="office">사무실</button><button id="save">현재 모델 JSON 저장</button><p id="links"></p></header>
<script src="../../vendor/three.min.js"></script><script src="../../vendor/OrbitControls.js"></script><script src="../../characters.js"></script><script src="../../decor.js"></script>
<script>
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(40,innerWidth/(innerHeight-155),.05,150), renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);renderer.outputEncoding=THREE.sRGBEncoding;scene.background=new THREE.Color(0x171c27);renderer.toneMapping=THREE.ACESFilmicToneMapping;
const controls=new THREE.OrbitControls(camera,renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x657082,.7));const sun=new THREE.DirectionalLight(0xffffff,.5);sun.position.set(8,15,10);scene.add(sun);
let model, mode;
function show(next){if(model) location.hash=next; mode=next;model=new THREE.Group();scene.add(model);
if(next==='office'){Decor.build(model,{small:true});Decor.theme(true);Decor.spots(3).forEach((p,i)=>Decor.deskSet(model,{...p.desk,exec:i===0,mats:[new THREE.MeshStandardMaterial({color:0x182b40}),new THREE.MeshStandardMaterial({color:0x182b40})]}));camera.position.set(32,28,32);controls.target.set(0,0,0);}
else{['claude','gpt','gemini'].forEach((name,i)=>{const rig=Characters.build({color:0x4f7cf7},name);rig.group.position.x=(i-1)*1.1;model.add(rig.group)});scene.add(new THREE.GridHelper(6,60,0x8293ac,0x343e50));camera.position.set(3,2.4,5);controls.target.set(0,.85,0);}
document.getElementById('links').innerHTML=(next==='office'?['office']:['claude','gpt','gemini']).map(n=>`<a href="${n}.obj" download>${n}.obj</a><a href="${n}.mtl" download>MTL</a>`).join('')+'<a href="dimensions.json">치수표</a>';controls.update();}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.mode;location.reload()});show(location.hash.slice(1)==='office'?'office':'characters');
document.getElementById('save').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(model.toJSON())],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=mode+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
function resize(){const h=Math.max(200,innerHeight-document.querySelector('header').offsetHeight);renderer.setSize(innerWidth,h);camera.aspect=innerWidth/h;if(mode==='office'){camera.position.set(1,.875,1).normalize().multiplyScalar(55/Math.min(1,camera.aspect))}camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script></html>
