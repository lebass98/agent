<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Office · 3D 캐릭터 & 에셋 스튜디오</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111520; color: #eef2f9; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Pretendard", system-ui, sans-serif; overflow: hidden; }
  header {
    position: relative; z-index: 10; padding: 12px 18px;
    background: rgba(19, 24, 36, 0.92); border-bottom: 1px solid rgba(255,255,255,0.09);
    backdrop-filter: blur(12px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand b { font-size: 16px; color: #fff; letter-spacing: -0.01em; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(79,124,247,0.22); color: #9dc2ff; border: 1px solid rgba(79,124,247,0.4); }
  .sub { font-size: 12px; color: #9aa6bc; margin-left: 4px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .seg { display: inline-flex; background: #1a2130; padding: 3px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.08); gap: 2px; }
  button {
    appearance: none; border: 0; background: transparent; color: #c5d0e3; padding: 6px 11px;
    border-radius: 6px; font: 600 12.5px system-ui, sans-serif; cursor: pointer; transition: 0.15s;
  }
  button:hover { color: #fff; background: rgba(255,255,255,0.07); }
  button.active { background: #3b6ef6; color: #fff; box-shadow: 0 2px 8px rgba(59,110,246,0.35); }
  button.action { background: #232c3f; border: 1px solid rgba(255,255,255,0.12); color: #e2e9f5; }
  button.action:hover { background: #2e3a52; }
  .subbar {
    position: relative; z-index: 9; padding: 8px 18px;
    background: rgba(15, 19, 29, 0.86); border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px;
  }
  .controls-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .lbl { color: #8c98b0; font-weight: 600; font-size: 11.5px; margin-right: 2px; }
  #links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #links a {
    color: #9dc9ff; text-decoration: none; padding: 3px 8px; border-radius: 5px;
    background: rgba(79,124,247,0.12); border: 1px solid rgba(79,124,247,0.25); font-size: 12px; font-weight: 600;
  }
  #links a:hover { background: rgba(79,124,247,0.24); color: #fff; }
  canvas { display: block; outline: none; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <b>Agent Office · 3D 캐릭터 스튜디오</b>
    <span class="badge">1단위 = 1m 정밀 조형</span>
    <span class="sub">Claude (1.72m) · GPT (1.78m) · Gemini (1.68m) — 드래그: 360° 회전 / 우클릭: 이동 / 휠: 확대</span>
  </div>
  <div class="toolbar">
    <div class="seg" id="modeSeg">
      <button data-mode="sheet3x3">시트 3×3 포즈 비교</button>
      <button data-mode="characters">캐릭터 3인 스튜디오</button>
      <button data-mode="apple">Apple 기기</button>
      <button data-mode="office">사무실 전체</button>
    </div>
    <button class="action" id="spinBtn">턴테이블 회전: 끔</button>
    <button class="action" id="wireBtn">와이어프레임</button>
    <button class="action" id="glb">현재 장면 GLB 저장</button>
    <button class="action" id="save">현재 장면 JSON 저장</button>
  </div>
</header>
<div class="subbar">
  <div class="controls-row" id="charControls">
    <span class="lbl">포즈:</span>
    <div class="seg" id="poseSeg">
      <button data-pose="stand" class="active">기본 정면</button>
      <button data-pose="lounge">1열: 소파 착석</button>
      <button data-pose="tea">2열: 커피 타임</button>
      <button data-pose="present">3열: 발표 포즈</button>
      <button data-pose="work">책상 타이핑</button>
      <button data-pose="walk">걷기 모션</button>
    </div>
    <span class="lbl" style="margin-left:8px">표정:</span>
    <div class="seg" id="exprSeg">
      <button data-expr="기본" class="active">기본</button>
      <button data-expr="웃음">웃음</button>
      <button data-expr="놀람">놀람</button>
      <button data-expr="집중">집중</button>
      <button data-expr="생각">생각</button>
    </div>
  </div>
  <div id="links"></div>
</div>

<script src="../../vendor/three.min.js"></script>
<script src="../../vendor/OrbitControls.js"></script>
<script src="../../model-kit.js"></script>
<script src="../../apple-assets.js"></script>
<script src="../../characters.js"></script>
<script src="../../vendor/GLTFExporter.js"></script>
<script src="../../decor.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.05, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.04;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.append(renderer.domElement);

scene.background = new THREE.Color(0x151a26);
if (window.ModelKit) scene.environment = ModelKit.environment(renderer).texture;

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// 스튜디오 3점 조명 (키 라이트 + 필 라이트 + 림 라이트)
const hemi = new THREE.HemisphereLight(0xf6f8ff, 0x3b4459, 0.82);
scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xfff8ee, 0.88);
keyLight.position.set(5, 10, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
Object.assign(keyLight.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 30 });
keyLight.shadow.normalBias = 0.015;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xc8dcff, 0.38);
fillLight.position.set(-6, 5, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffe7cc, 0.34);
rimLight.position.set(0, 6, -7);
scene.add(rimLight);

const stageHelpers = new THREE.Group();
scene.add(stageHelpers);

let model = null, mode = "sheet3x3", currentPose = "stand", currentExpr = "기본";
let activeRigs = [], spinning = false, wireframe = false, walkClock = 0;
const COLORS = { claude: 0xd97757, gpt: 0x10a37f, gemini: 0x4f7cf7 };

function clearStage() {
  if (model) scene.remove(model);
  while (stageHelpers.children.length) stageHelpers.remove(stageHelpers.children[0]);
  activeRigs = [];
  model = new THREE.Group();
  scene.add(model);
}

function makeStool(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const cushionMat = new THREE.MeshStandardMaterial({ color: 0x2c3446, roughness: 0.82 });
  const legMat = new THREE.MeshStandardMaterial({ color: 0x6b7488, roughness: 0.4, metalness: 0.5 });
  const seat = new THREE.Mesh(window.ModelKit ? ModelKit.roundedBox(0.46, 0.08, 0.44, 0.025) : new THREE.BoxGeometry(0.46, 0.08, 0.44), cushionMat);
  seat.position.set(0, 0.46, -0.04);
  seat.castShadow = seat.receiveShadow = true;
  g.add(seat);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.032, 0.42, 16), legMat);
  pole.position.set(0, 0.21, -0.04);
  g.add(pole);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.24, 0.02, 24), legMat);
  base.position.set(0, 0.01, -0.04);
  base.receiveShadow = true;
  g.add(base);
  return g;
}

function buildFloor(size = 8) {
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(size, size),
    new THREE.MeshStandardMaterial({ color: 0x192030, roughness: 0.88, metalness: 0.05 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  stageHelpers.add(floor);
  const grid = new THREE.GridHelper(size, size * 5, 0x4b5b78, 0x263044);
  grid.position.y = 0.002;
  stageHelpers.add(grid);
}

function applyWireframe(root, on) {
  root.traverse(o => {
    if (o.isMesh && o.material) {
      for (const m of Array.isArray(o.material) ? o.material : [o.material]) m.wireframe = on;
    }
  });
}

function show(next) {
  mode = next;
  location.hash = next;
  clearStage();
  document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("active", b.dataset.mode === next));
  const charCtrl = document.getElementById("charControls");
  charCtrl.style.display = (next === "characters" || next === "sheet3x3") ? "flex" : "none";

  if (next === "office") {
    Decor.build(model, { small: true });
    Decor.theme(true);
    Decor.spots(3).forEach((p, i) => Decor.deskSet(model, {
      ...p.desk, exec: i === 0,
      mats: [new THREE.MeshStandardMaterial({ color: 0x182b40 }), new THREE.MeshStandardMaterial({ color: 0x182b40 })]
    }));
    camera.position.set(32, 26, 32);
    controls.target.set(0, 0, 0);
  } else if (next === "apple") {
    buildFloor(6);
    ["Studio Display", "Mac mini", "Magic Keyboard", "Magic Mouse", "MacBook", "iPad", "Apple TV", "HomePod mini"].forEach((name, i) => {
      const a = AppleAssets.build(name);
      a.group.position.set((i % 4 - 1.5) * 0.85, 0, Math.floor(i / 4) * 0.7);
      model.add(a.group);
    });
    camera.position.set(2.0, 1.8, 2.8);
    controls.target.set(0, 0.25, 0.3);
  } else if (next === "sheet3x3") {
    // 업로드된 3×3 캐릭터 시트와 동일한 3행(Claude / GPT / Gemini) × 3열(소파 착석 / 커피 타임 / 발표 포즈) 3D 배치
    buildFloor(8);
    const names = ["claude", "gpt", "gemini"];
    const poses = ["lounge", "tea", "present"];
    names.forEach((name, row) => {
      poses.forEach((poseName, col) => {
        const rig = Characters.build({ color: COLORS[name] }, name);
        rig.setPose(poseName);
        const x = (col - 1) * 1.15;
        const z = (row - 1) * 1.35;
        rig.group.position.set(x, 0, z);
        model.add(rig.group);
        activeRigs.push({ rig, name, basePose: poseName });
        if (poseName === "lounge") stageHelpers.add(makeStool(x, z));
      });
    });
    camera.position.set(0, 2.35, 5.2);
    controls.target.set(0, 0.92, 0);
  } else {
    // 캐릭터 3인 스튜디오
    buildFloor(6);
    ["claude", "gpt", "gemini"].forEach((name, i) => {
      const rig = Characters.build({ color: COLORS[name] }, name);
      rig.setPose(currentPose === "walk" ? "stand" : currentPose);
      rig.setFace(currentExpr);
      const x = (i - 1) * 1.05;
      rig.group.position.set(x, 0, 0);
      model.add(rig.group);
      activeRigs.push({ rig, name, basePose: currentPose });
      if (currentPose === "lounge" || currentPose === "work") stageHelpers.add(makeStool(x, 0));
    });
    camera.position.set(0, 1.55, 3.35);
    controls.target.set(0, 0.90, 0);
  }

  if (wireframe) applyWireframe(model, true);

  const linkItems = (next === "office")
    ? [`<a href="office.glb" download>office.glb</a>`, `<a href="office.obj" download>office.obj</a>`, `<a href="office.mtl" download>office.mtl</a>`]
    : (next === "apple")
    ? [`<a href="apple.glb" download>apple.glb</a>`, `<a href="apple.obj" download>apple.obj</a>`, `<a href="apple.mtl" download>apple.mtl</a>`]
    : [
        `<a href="characters.glb" download>3인 통합 GLB</a>`,
        `<a href="claude.glb" download>claude.glb</a>`,
        `<a href="gpt.glb" download>gpt.glb</a>`,
        `<a href="gemini.glb" download>gemini.glb</a>`,
        `<a href="claude.obj" download>claude.obj</a>`,
        `<a href="gpt.obj" download>gpt.obj</a>`,
        `<a href="gemini.obj" download>gemini.obj</a>`,
      ];
  document.getElementById("links").innerHTML = linkItems.join("") + `<a href="dimensions.json">치수표(JSON)</a>`;
  controls.update();
}

document.querySelectorAll("#modeSeg button").forEach(b => {
  b.onclick = () => show(b.dataset.mode);
});

document.querySelectorAll("#poseSeg button").forEach(b => {
  b.onclick = () => {
    currentPose = b.dataset.pose;
    document.querySelectorAll("#poseSeg button").forEach(x => x.classList.toggle("active", x === b));
    if (mode === "sheet3x3") {
      show("characters");
    } else {
      show(mode);
    }
  };
});

document.querySelectorAll("#exprSeg button").forEach(b => {
  b.onclick = () => {
    currentExpr = b.dataset.expr;
    document.querySelectorAll("#exprSeg button").forEach(x => x.classList.toggle("active", x === b));
    activeRigs.forEach(({ rig }) => rig.setFace(currentExpr));
  };
});

document.getElementById("spinBtn").onclick = e => {
  spinning = !spinning;
  e.currentTarget.textContent = `턴테이블 회전: ${spinning ? "켬" : "끔"}`;
  e.currentTarget.classList.toggle("active", spinning);
};

document.getElementById("wireBtn").onclick = e => {
  wireframe = !wireframe;
  e.currentTarget.classList.toggle("active", wireframe);
  if (model) applyWireframe(model, wireframe);
};

document.getElementById("glb").onclick = () => new THREE.GLTFExporter().parse(model, data => {
  const url = URL.createObjectURL(new Blob([data], { type: "model/gltf-binary" }));
  const a = document.createElement("a"); a.href = url; a.download = `${mode}.glb`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}, { binary: true });

document.getElementById("save").onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(model.toJSON())], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = `${mode}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

function resize() {
  const headerH = document.querySelector("header").offsetHeight + document.querySelector(".subbar").offsetHeight;
  const h = Math.max(240, innerHeight - headerH);
  renderer.setSize(innerWidth, h);
  camera.aspect = innerWidth / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

const initialHash = location.hash.slice(1);
show(["sheet3x3", "characters", "office", "apple"].includes(initialHash) ? initialHash : "sheet3x3");
resize();

let lastT = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  walkClock += dt;
  if (spinning && model) model.rotation.y += dt * 0.65;
  if (mode === "characters" && currentPose === "walk") {
    activeRigs.forEach(({ rig }, idx) => {
      const s = Math.sin(walkClock * 6 + idx * 1.2);
      rig.legs[0].rotation.x = s * 0.55;
      rig.legs[1].rotation.x = -s * 0.55;
      rig.knees[0].rotation.x = Math.max(0, s) * 0.65;
      rig.knees[1].rotation.x = Math.max(0, -s) * 0.65;
      rig.arms[0].rotation.x = -s * 0.45;
      rig.arms[1].rotation.x = s * 0.45;
      rig.elbows[0].rotation.x = -0.25 - Math.max(0, -s) * 0.25;
      rig.elbows[1].rotation.x = -0.25 - Math.max(0, s) * 0.25;
    });
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
