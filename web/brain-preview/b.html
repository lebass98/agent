<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브레인 모드 시안 B · 타임라인 포커스</title>
<link rel="stylesheet" href="../vendor/pretendard-gov/pretendardvariable-gov-dynamic-subset.css">
<link rel="stylesheet" href="brain.css">
<script src="brain-kit.js"></script>
<style>
/* B · 타임라인 포커스: 가운데는 하루·한 주 일정(모든 캘린더 통합), 중요 일정은 그 위에 크게 고정.
   왼쪽은 바로가기·스킬(도구), 오른쪽은 메일·회의록·루틴 탭(정보). AI 팀은 상단 얼굴 셋으로만 */
body { display: flex; flex-direction: column; overflow: hidden; }
.shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 76px minmax(0, 1fr); }
.main { min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px 18px 14px; }
.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr) 360px; gap: 14px; }
.col { min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.col .card { min-height: 0; }
.col .card .body { overflow: auto; scrollbar-width: thin; }
.left .apps { grid-template-columns: repeat(3, 1fr); gap: 10px 4px; }
.left .app .tile { width: 42px; height: 42px; border-radius: 12px; font-size: 15px; }
.center .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.center .head h2 { font-size: 18px; letter-spacing: -.4px; }
.pinned { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.pinned .fl { padding: 12px; align-items: flex-start; flex-direction: column; gap: 8px; }
.pinned .fl .when { min-width: 0; height: auto; padding: 4px 10px; border-radius: 8px; display: inline-flex; gap: 6px; align-items: baseline; font-size: 13px; }
.pinned .fl .when small { display: inline; }
.pinned .fl .x { position: absolute; right: 8px; top: 8px; }
.pinned .fl b { font-size: 14px; }
.pinned .fl span.sub { white-space: normal; }
.calcard { flex: 1; min-height: 0; }
.calcard .body { flex: 1; overflow: auto; scrollbar-width: thin; }
#week .wday { min-height: 120px; }
.right .tabs { display: flex; gap: 2px; padding: 4px; margin: 10px 12px 6px; background: var(--chip); border-radius: 10px; }
.right .tabs button { flex: 1; padding: 6px 0; border-radius: 8px; font-size: 12px; color: var(--muted); display: inline-flex; gap: 5px; justify-content: center; align-items: center; }
.right .tabs button[aria-selected="true"] { background: var(--panel); color: var(--text); font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.right .tabs em { font-style: normal; font-size: 10.5px; background: var(--err); color: #fff; border-radius: 999px; padding: 0 5px; }
.right .card { flex: 1; }
.pane { padding: 0 14px 14px; overflow: auto; flex: 1; min-height: 0; scrollbar-width: thin; }
.faces .tm { padding: 3px; }
.faces { gap: 4px; }
.cmdwrap { display: flex; justify-content: center; }
.cmdwrap .command { width: min(820px, 100%); }
@media (max-width: 1250px) { .cols { grid-template-columns: minmax(0, 1fr) 330px; } .left { display: none; } .pinned { grid-template-columns: 1fr 1fr; } .pinned .fl:nth-child(3) { display: none; } }
@media (max-width: 860px) { .shell { grid-template-columns: minmax(0, 1fr); } .rail, .search, .conn { display: none; } body, .main { overflow: auto; } .cols { grid-template-columns: minmax(0, 1fr); } .pinned { grid-template-columns: 1fr; } .pinned .fl:nth-child(3) { display: flex; } }
</style>
</head>
<body>
<div class="shell">
  <script>document.write(Brain.rail("cal"))</script>
  <main class="main">
    <script>document.write(Brain.topbar('<div id="faces" class="faces"></div>'))</script>
    <div class="cols">
      <div class="col left">
        <section data-moxie="iman" class="card rise"><header><h3><span data-i="grid"></span>바로가기</h3><small>Vercel</small></header><div class="body"><div id="apps"></div></div></section>
        <section data-moxie="hallazgo segmentos" class="card rise" style="flex:1;animation-delay:.05s"><header><h3><span data-i="spark"></span>스킬</h3><small>8개</small></header>
          <div style="padding:0 12px 8px"><div id="skTabs"></div></div><div class="body"><div id="skills"></div></div></section>
      </div>
      <div class="col center">
        <div class="head"><h2 id="today"></h2><div id="src"></div><span class="grow"></span><div class="seg" id="view"><button data-v="day" aria-selected="true">일</button><button data-v="week" aria-selected="false">주</button><button data-v="agenda" aria-selected="false">목록</button></div></div>
        <div class="pinned" id="pinned" data-moxie="pila baliza"></div>
        <section data-moxie="semana lunario segmentos" class="card calcard rise"><header><h3><span data-i="cal"></span>통합 캘린더</h3><small>Google · Notion · 휴대폰 — 겹치는 일정은 하나로</small><span class="more">+ 일정</span></header>
          <div class="body"><div id="day"></div><div id="week" hidden></div><div id="agenda" hidden></div></div></section>
      </div>
      <div class="col right">
        <section data-moxie="capsula insignia bandeja esqueleto acordeon jornada brinco" class="card rise" style="animation-delay:.08s">
          <div class="tabs" id="tabs"><button data-t="mail" aria-selected="true"><span data-i="mail"></span>메일 <em>2</em></button><button data-t="meet" aria-selected="false"><span data-i="note"></span>회의록</button><button data-t="rt" aria-selected="false"><span data-i="repeat"></span>루틴 <em>1</em></button></div>
          <div class="pane" id="p-mail"><p class="muted" style="font-size:11.5px;margin:2px 0 6px">Gmail · 08:30 AI 요약 · 받은편지함 23통 중 5건</p><div id="mail"></div></div>
          <div class="pane" id="p-meet" hidden><div id="meet"></div></div>
          <div class="pane" id="p-rt" hidden><div id="rt"></div></div>
        </section>
      </div>
    </div>
    <div class="cmdwrap" data-moxie="pregunta corrillo sintonia"><script>document.write(Brain.command())</script></div>
  </main>
</div>
<script>
Brain.bar("b.html", "일정이 주인공. 가운데 통합 캘린더(일·주·목록) 위에 중요 일정을 크게 고정. 왼쪽 도구(바로가기·스킬), 오른쪽 정보(메일·회의록·루틴 탭). AI 팀은 상단 얼굴 셋.");
const B = Brain, $ = B.$, $$ = B.$$;
$$("[data-i]").forEach(s => { s.outerHTML = B.ic(s.dataset.i, 14); });
const d = new Date(); $("#today").textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`;
B.team($("#faces"), "faces"); B.apps($("#apps")); B.skills($("#skills"), $("#skTabs")); B.sourceChips($("#src"));
B.floats($("#pinned")); $("#pinned").classList.remove("float-strip"); $("#pinned").classList.add("pinned");
B.dayView($("#day"), 8, 21); B.weekView($("#week")); B.agenda($("#agenda"), 7);
B.mail($("#mail")); B.meetings($("#meet")); B.routines($("#rt"));
$("#view").onclick = e => { const b = e.target.closest("button"); if (!b) return; $$("button", $("#view")).forEach(x => x.setAttribute("aria-selected", x === b)); for (const v of ["day", "week", "agenda"]) $("#" + v).hidden = v !== b.dataset.v; };
$("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return; $$("button", $("#tabs")).forEach(x => x.setAttribute("aria-selected", x === b)); for (const t of ["mail", "meet", "rt"]) $("#p-" + t).hidden = t !== b.dataset.t; };
</script>
<script src="brain-moxie.js"></script>
</body>
</html>
